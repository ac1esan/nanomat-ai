<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NanoMatAI — 2D band gap screening</title>
<meta name="description" content="Browse predicted band gaps of 28 372 two-dimensional structures, with a calibrated uncertainty and an explicit trust verdict on every row.">
<script>
// Before the stylesheet paints, or a viewer who chose light would see the dark
// page flash first. The main script re-reads the same key and owns it from there.
try {
  var _t = localStorage.getItem("nanomat-theme");
  if (_t === "light" || _t === "dark") document.documentElement.dataset.theme = _t;
} catch (e) { /* private window or blocked site data: fall back to the system */ }
</script>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --surface-2:#f4f3f0; --surface-3:#ebeae6;
  --border:#e0dfda; --border-strong:#c9c8c2;
  --text-1:#0b0b0b; --text-2:#52514e; --text-3:#87867f;
  --tier-0:#008300; --tier-1:#4a3aa7; --tier-2:#e34948;
  --accent:#2a78d6; --warn-bg:#fdf4e3; --warn-border:#e3c37a;
  --ramp-lo:#eef4fb; --ramp-hi:#10396b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface-1:#1a1a19; --surface-2:#232322; --surface-3:#2d2d2b;
    --border:#37372f; --border-strong:#4d4d45;
    --text-1:#ffffff; --text-2:#c3c2b7; --text-3:#8d8c83;
    --tier-0:#008300; --tier-1:#9085e9; --tier-2:#e66767;
    --accent:#3987e5; --warn-bg:#2e2716; --warn-border:#6b5722;
    --ramp-lo:#20303f; --ramp-hi:#8fc0f5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --surface-2:#232322; --surface-3:#2d2d2b;
  --border:#37372f; --border-strong:#4d4d45;
  --text-1:#ffffff; --text-2:#c3c2b7; --text-3:#8d8c83;
  --tier-0:#008300; --tier-1:#9085e9; --tier-2:#e66767;
  --accent:#3987e5; --warn-bg:#2e2716; --warn-border:#6b5722;
  --ramp-lo:#20303f; --ramp-hi:#8fc0f5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-1);color:var(--text-1);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
a{color:var(--accent)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 18px 60px}
header h1{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--text-2);max-width:70ch}
.links{margin-top:10px;font-size:13px;color:var(--text-3);display:flex;flex-wrap:wrap;
  align-items:center;gap:0 14px}
.links a{margin-right:0}
.themebtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tabs{display:flex;gap:4px;margin:22px 0 14px;border-bottom:1px solid var(--border)}
.tab{padding:8px 14px;border:0;background:none;color:var(--text-2);font:inherit;
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--text-1);border-bottom-color:var(--accent);font-weight:600}
.panel[hidden]{display:none!important}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;
  background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.field{display:flex;flex-direction:column;gap:5px}
.field > label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)}
input[type=text],input[type=number],select{background:var(--surface-1);color:var(--text-1);
  border:1px solid var(--border-strong);border-radius:5px;padding:5px 7px;font:inherit;font-size:13px}
input[type=number]{width:72px}
.field.edges input[type=number]{width:58px}
.edgetag{font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:.03em}
.chips{display:flex;gap:5px}
.chip{border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-2);
  border-radius:99px;padding:4px 11px;font:inherit;font-size:12px;cursor:pointer;display:flex;
  align-items:center;gap:6px}
.chip[aria-pressed="true"]{color:var(--text-1);border-color:currentColor;font-weight:600}
.chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.chip.t0[aria-pressed="true"]{color:var(--tier-0)}
.chip.t1[aria-pressed="true"]{color:var(--tier-1)}
.chip.t2[aria-pressed="true"]{color:var(--tier-2)}
.chip.t0 .dot{background:var(--tier-0)} .chip.t1 .dot{background:var(--tier-1)} .chip.t2 .dot{background:var(--tier-2)}
.presets{display:flex;gap:5px;flex-wrap:wrap}
.preset{border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-2);
  border-radius:5px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer}
.preset:hover{border-color:var(--accent);color:var(--accent)}
.check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2)}
.banner{margin-top:12px;background:var(--warn-bg);border:1px solid var(--warn-border);
  border-radius:7px;padding:10px 12px;font-size:13px;color:var(--text-1)}
.banner b{font-weight:600}
.count{margin:14px 0 8px;font-size:13px;color:var(--text-2)}
.count b{color:var(--text-1)}

/* chart */
.chartbox{position:relative;background:var(--surface-2);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px 6px}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.chart-head h2{font-size:14px;margin:0 0 2px}
.chart-head p{margin:0;font-size:12px;color:var(--text-3);max-width:72ch}
.legend{display:flex;gap:12px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
canvas{display:block;width:100%;height:320px;cursor:crosshair}
.tip{position:absolute;pointer-events:none;background:var(--surface-1);border:1px solid var(--border-strong);
  border-radius:6px;padding:6px 9px;font-size:12px;box-shadow:0 3px 12px rgba(0,0,0,.14);
  white-space:nowrap;z-index:5}
.tip b{display:block;font-size:13px}

/* results */
.results{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;margin-top:16px;align-items:start}
@media (max-width:900px){.results{grid-template-columns:1fr}}
.tablebox{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.thead{display:grid;grid-template-columns:1.4fr .9fr .75fr .8fr .85fr 1.3fr;gap:8px;padding:8px 12px;
  background:var(--surface-3);border-bottom:1px solid var(--border);font-size:11px;
  text-transform:uppercase;letter-spacing:.04em;color:var(--text-3)}
.thead button{all:unset;cursor:pointer;display:flex;align-items:center;gap:4px}
.thead button:hover{color:var(--text-1)}
.scroller{height:420px;overflow-y:auto;position:relative}
.row{display:grid;grid-template-columns:1.4fr .9fr .75fr .8fr .85fr 1.3fr;gap:8px;padding:7px 12px;
  border-bottom:1px solid var(--border);cursor:pointer;font-size:13px;align-items:center}
.row:hover{background:var(--surface-3)}
.row[aria-selected="true"]{background:var(--surface-3);box-shadow:inset 3px 0 0 var(--accent)}
.row .f{font-weight:600;display:flex;align-items:center;gap:6px}
.badge{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--surface-1);
  border:1px solid var(--border-strong);color:var(--text-3);font-weight:400;white-space:nowrap}
.tierdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.v{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.num{font-variant-numeric:tabular-nums}
.empty{padding:36px 12px;text-align:center;color:var(--text-3)}

/* detail */
.detail{border:1px solid var(--border);border-radius:8px;background:var(--surface-2);padding:14px;
  position:sticky;top:14px}
.detail h3{margin:0 0 2px;font-size:17px}
.detail .sub{color:var(--text-3);font-size:12px;margin:0 0 12px}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;margin:0;font-size:13px}
.detail dt{color:var(--text-2)}
.detail dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.detail .big{font-size:19px;font-weight:600;margin:6px 0 10px}
.detail .note{margin-top:12px;padding:9px 10px;border-radius:6px;background:var(--surface-3);
  font-size:12px;color:var(--text-2);line-height:1.45}
.detail .stop{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--text-1)}

/* families */
.famgrid{overflow-x:auto;margin:14px 0 6px}
.famgrid table{border-collapse:separate;border-spacing:3px}
.famgrid th{font-size:11px;font-weight:600;color:var(--text-2);padding:2px 6px;text-align:center}
.famgrid th.rowh{text-align:right}
.famcell{width:58px;height:44px;border-radius:4px;border:1px solid transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.famcell b{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.famcell small{font-size:9px;opacity:.8}
.famcell.none{background:var(--surface-3);cursor:default;border-color:var(--border)}
/* exists in the table but the filters above exclude it. It has to stay READABLE:
   an earlier version used opacity and in dark mode the grid turned into a black
   rectangle, which is worse than the empty grid it was meant to fix. The difference
   from a passing cell is the colour ramp against a neutral background, not dimness. */
.famcell.muted{background:var(--surface-3);border-color:var(--border-strong)}
.famcell.muted b{font-weight:500;color:var(--text-2)}
.famcell.muted small{color:var(--text-3)}
.famcell.unsure{border-style:dashed;border-color:currentColor}
.famcell.sel{outline:2px solid var(--accent);outline-offset:1px}
.famcell.trained{position:relative}
.famcell.trained::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;
  border-radius:50%;background:currentColor;opacity:.65}
.famhead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}

/* trust map */
.ptable{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:3px;margin:16px 0 8px}
.cell{aspect-ratio:1;border-radius:4px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-size:11px;line-height:1.1;border:1px solid transparent;min-height:34px}
.cell b{font-size:12px;font-weight:600}
.cell small{font-size:9px;opacity:.85;font-variant-numeric:tabular-nums}
.cell.void{background:none}
.cell.nodata{background:var(--surface-3);color:var(--text-3);border-color:var(--border)}
/* wrap: the legend grew to four items and on a phone a non-wrapping row pushed the
   whole page 180px wider than the viewport */
.ramp{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;font-size:12px;
  color:var(--text-2);margin:4px 0 16px}
.ramp .bar{height:11px;max-width:190px;flex:1 1 90px;border-radius:3px;
  background:linear-gradient(to right,var(--ramp-lo),var(--ramp-hi));border:1px solid var(--border)}
.prose{max-width:76ch;color:var(--text-2);font-size:13px}
.prose h2{color:var(--text-1);font-size:15px;margin:20px 0 6px}
.prose code{background:var(--surface-3);padding:1px 5px;border-radius:3px;font-size:12px}
.loading{padding:60px 0;text-align:center;color:var(--text-3)}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);
  font-size:12px;color:var(--text-3)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 id="t-title">NanoMatAI — 2D band gap screening</h1>
  <p id="t-lede"></p>
  <!-- target=_blank is required, not cosmetic: on Hugging Face this page is served
       inside a sandboxed iframe that forbids top-level navigation, and GitHub refuses
       to render inside a frame, so a same-frame link lands on a blank page. -->
  <div class="links">
    <a href="https://github.com/ac1esan/nanomat-ai" target="_blank" rel="noopener noreferrer">GitHub</a>
    <a href="https://github.com/ac1esan/nanomat-ai/blob/main/MODEL_CARD.md" target="_blank" rel="noopener noreferrer" id="t-mc">Model card</a>
    <a href="https://github.com/ac1esan/nanomat-ai#knowing-when-not-to-believe-it" target="_blank" rel="noopener noreferrer" id="t-how">How the verdict works</a>
    <a href="https://github.com/ac1esan/nanomat-ai#quick-start" target="_blank" rel="noopener noreferrer" id="t-own">Run your own structure</a>
    <button class="preset themebtn" id="theme-btn" type="button" aria-live="polite"></button>
  </div>
</header>

  <div class="filters">
    <div class="field">
      <label id="t-f-pop">Population</label>
      <select id="f-pop"></select>
    </div>
    <div class="field">
      <label id="t-f-gap">Band gap, eV</label>
      <div style="display:flex;gap:5px;align-items:center">
        <input type="number" id="f-gmin" step="0.1" placeholder="min">
        <span style="color:var(--text-3)">–</span>
        <input type="number" id="f-gmax" step="0.1" placeholder="max">
      </div>
    </div>
    <div class="field">
      <label id="t-f-preset">Quick range</label>
      <div class="presets" id="f-presets"></div>
    </div>
    <div class="field edges">
      <label id="t-f-edge">Band edges vs vacuum, eV</label>
      <div style="display:flex;gap:6px;align-items:center">
        <span class="edgetag" title="electron affinity">χ</span>
        <input type="number" id="f-eamin" step="0.1" placeholder="min">
        <span style="color:var(--text-3)">–</span>
        <input type="number" id="f-eamax" step="0.1" placeholder="max">
        <span class="edgetag" style="margin-left:7px" title="ionisation potential">IP</span>
        <input type="number" id="f-ipmin" step="0.1" placeholder="min">
        <span style="color:var(--text-3)">–</span>
        <input type="number" id="f-ipmax" step="0.1" placeholder="max">
      </div>
    </div>
    <div class="field">
      <label id="t-f-tier">Trust</label>
      <div class="chips" id="f-tiers"></div>
    </div>
    <div class="field">
      <label id="t-f-type">Gap type</label>
      <select id="f-type"></select>
    </div>
    <div class="field">
      <label id="t-f-has">Must contain</label>
      <input type="text" id="f-has" placeholder="Mo S" size="10">
    </div>
    <div class="field">
      <label id="t-f-not">Must not contain</label>
      <input type="text" id="f-not" placeholder="Pb Cd" size="10">
    </div>
    <div class="field">
      <label id="t-f-search">Formula</label>
      <input type="text" id="f-q" placeholder="MoS2" size="8">
    </div>
    <label class="check"><input type="checkbox" id="f-notrain"> <span id="t-f-notrain">Exclude training rows</span></label>
    <button class="preset" id="f-reset">Reset</button>
  </div>
  <div id="pop-warning"></div>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" aria-selected="true" data-panel="browse" id="t-tab1">Browse</button>
  <button class="tab" role="tab" aria-selected="false" data-panel="fam" id="t-tab3">Families</button>
  <button class="tab" role="tab" aria-selected="false" data-panel="trust" id="t-tab2">Trust map</button>
</div>

<div class="loading" id="loading">Loading 28 372 predictions…</div>

<section class="panel" id="panel-browse" hidden>
  <p class="count" id="count"></p>

  <div class="chartbox">
    <div class="chart-head">
      <div>
        <h2 id="t-c-title">Predicted gap against the model's own uncertainty</h2>
        <p id="t-c-sub"></p>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="preset" id="chart-reset" hidden></button>
        <div class="legend" id="legend"></div>
      </div>
    </div>
    <canvas id="chart"></canvas>
    <div class="tip" id="tip" hidden></div>
  </div>

  <div class="results">
    <div class="tablebox">
      <div class="thead" id="thead"></div>
      <div class="scroller" id="scroller"><div id="spacer"></div><div id="rows" style="position:absolute;top:0;left:0;right:0"></div></div>
    </div>
    <aside class="detail" id="detail"></aside>
  </div>
</section>

<section class="panel" id="panel-fam" hidden>
  <div class="prose"><p id="t-fam-lede"></p></div>
  <div class="famhead">
    <div class="field">
      <label id="t-fam-pick">Prototype</label>
      <select id="fam-pick"></select>
    </div>
    <div class="field">
      <label id="t-fam-scope">Population</label>
      <select id="fam-scope"></select>
    </div>
    <div class="ramp" style="margin:0">
      <span id="t-fam-lo"></span><span class="bar"></span><span id="t-fam-hi"></span>
      <span style="display:flex;align-items:center;gap:6px">
        <span class="famcell unsure" style="width:16px;height:16px;background:var(--ramp-lo);
          border-color:var(--text-2)"></span><span id="t-fam-unsure"></span></span>
      <span style="display:flex;align-items:center;gap:6px">
        <span class="famcell trained" style="width:16px;height:16px;background:var(--ramp-lo);
          color:var(--text-2)"></span><span id="t-fam-trained"></span></span>
      <span style="display:flex;align-items:center;gap:6px">
        <span class="famcell muted" style="width:16px;height:16px"></span>
        <span id="t-fam-greyed"></span></span>
    </div>
  </div>
  <p class="count" id="fam-count"></p>
  <div class="results">
    <div class="famgrid" id="famgrid"></div>
    <aside class="detail" id="fam-detail"></aside>
  </div>
  <p class="prose" id="t-fam-scopenote" style="margin:4px 0 0"></p>
  <p class="prose" id="fam-axisnote" style="margin:4px 0 0"></p>
  <div class="prose" id="fam-prose"></div>
</section>

<section class="panel" id="panel-trust" hidden>
  <div class="prose">
    <p id="t-tm-lede"></p>
  </div>
  <div class="ptable" id="ptable"></div>
  <div class="ramp">
    <span id="t-tm-lo"></span><span class="bar"></span><span id="t-tm-hi"></span>
    <span style="display:flex;align-items:center;gap:6px">
      <span class="cell" style="width:16px;height:16px;min-height:0;aspect-ratio:auto;
        background:var(--ramp-lo);border-style:dashed;border-color:var(--text-2)"></span>
      <span id="t-tm-sparse"></span></span>
    <span style="display:flex;align-items:center;gap:6px">
      <span class="cell nodata" style="width:16px;height:16px;min-height:0;aspect-ratio:auto"></span>
      <span id="t-tm-nodata"></span></span>
  </div>
  <div class="prose" id="tm-prose"></div>
</section>

<footer id="t-footer"></footer>
</div>

<script>
"use strict";
/* ---------------------------------------------------------------------------
   Strings live here, keyed by language, so another language is a translation
   rather than a rewrite. Everything user-visible goes through t().
--------------------------------------------------------------------------- */
const I18N = {
  en: {
    title: "NanoMatAI — 2D band gap screening",
    lede: n => `Predicted band gaps for ${n} two-dimensional structures, each with a calibrated interval and an explicit verdict on whether to believe it. A second ensemble adds the vacuum-referenced work function, and the two together place the band edges — the pair a contact metal is chosen on. Nothing is computed here: this is a graph neural network's output, precomputed once and served as a static table.`,
    tab_browse: "Browse", tab_trust: "Trust map", tab_fam: "Families",
    fam_lede: "Nobody asks what the gap of one database entry is. They ask what happens across a family when the chalcogen changes. This pivots the same predictions into that shape: pick a prototype, read the grid.",
    fam_pick: "Prototype", fam_pop: "Population",
    fam_scope_all: "Every structure of this prototype",
    fam_scope_browse: "Only what the filters above keep",
    fam_scope_note: "A family is a comparison, so this tab starts from all of it. Every cell still says what it is: a dot for a structure the model trained on, a dashed border for anything outside the reliable tier. The calibrated intervals belong to the Browse tab's population, not to this grid.",
    fam_lo: "narrow", fam_hi: "wide", fam_unsure: "not in the reliable tier",
    fam_trained: "the model trained on this one",
    fam_filtered: "outside the current filters",
    fam_greyed: "greyed: excluded by the filters above",
    fam_count: (shown, total) => `<b>${shown}</b> of ${total} element pairs in this prototype are in view; the rest of the family is greyed rather than hidden`,
    fam_axis_a: "single site", fam_axis_b: "doubled site",
    fam_axis_note: "Rows and columns are structural positions, not chemical roles: the row element occupies the single site of the prototype and the column element the doubled one. For Rb₂O that puts oxygen in the row, which is what the structure says even though the chemistry reads the other way.",
    fam_opt: (label, n, pairs) => `${label} — ${n} structures, ${pairs} pairs`,
    fam_empty: "No structure in the table matches this prototype.",
    fam_multi: n => `${n} entries for this pair; the one with the smallest ensemble spread is shown`,
    fam_prose: `<h2>How to read it</h2><p>Each cell is one element pair in the chosen prototype, coloured by predicted band gap. A dashed border means the tool does not place that prediction in its reliable tier. A dot in the corner means the model trained on that structure, so the number is reproduced from memory rather than predicted — its error is about 0.08 eV instead of the honest 0.26.</p><p>The chemistry and band-gap filters above govern this grid, but the population does not: this tab has its own, and it starts from the whole prototype. Sharing the Browse tab's honest default left one pair of ninety-eight visible, and a grid of blanks is not an honest answer, it is an unreadable one. The per-cell marks carry the same information instead. Switch the population to <i>only what the filters above keep</i> to see exactly which cells that default endorses; what falls outside is greyed rather than deleted, because the shape of a family is a fact about the data and not about the current filter.</p><p>Where a pair has several entries, the one with the smallest ensemble spread is shown. Nothing is generated: every cell is a structure somebody computed, which is why a family still has holes.</p>`,

let LANG = "en";
const t = (k, ...a) => { const v = I18N[LANG][k]; return typeof v === "function" ? v(...a) : v; };
const fmt = (x, n = 2) => (x === null || x === undefined || Number.isNaN(x)) ? "—" : x.toFixed(n);
const int = x => x.toLocaleString("en-US").replace(/,/g, " ");

/* --------------------------------------------------------------------- state */
const S = {
  meta: null, rows: [], view: [], sel: null,
  sort: { key: "g", dir: 1 },
  // The families tab keeps its own population. Sharing the browser's meant that the
  // honest default - stable, held out from training - left 1 of 98 pairs for 1T-MX2
  // and none at all for the honeycombs, and a grid of blanks teaches nobody
  // anything. Every cell still carries its own marks: a dot for a training row, a
  // dashed border for anything outside the reliable tier.
  fam: { pick: 0, sel: null, scope: 0 },
  // chart viewport. null = fit to the filtered data. Set by wheel-zoom and drag-pan,
  // which is the only way to tell points apart once 28 000 of them overlap.
  zoom: null,
  hover: null,
  f: { pop: 0, gmin: null, gmax: null, tiers: [true, true, false], type: -1,
       has: [], not: [], q: "", notrain: false,
       eamin: null, eamax: null, ipmin: null, ipmax: null },
  hiddenByTier: 0,
};
const BLANK_FILTERS = () => ({ pop: 0, gmin: null, gmax: null, tiers: [true, true, false],
  type: -1, has: [], not: [], q: "", notrain: false,
  eamin: null, eamax: null, ipmin: null, ipmax: null });
const TIERVAR = ["--tier-0", "--tier-1", "--tier-2"];

/* --------------------------------------------------------------------- theme */
// Three states rather than two, so "follow the system" stays reachable once a
// viewer has picked a side. The choice is a per-viewer convenience, so it lives in
// localStorage and every access is guarded: a private window or blocked site data
// makes these throw, and the page has to render anyway.
const THEMES = ["system", "light", "dark"];
let THEME = "system";
function readTheme() {
  try {
    const v = localStorage.getItem("nanomat-theme");
    return THEMES.includes(v) ? v : "system";
  } catch (e) { return "system"; }
}
function applyTheme(next, redraw) {
  THEME = next;
  if (next === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = next;
  try { localStorage.setItem("nanomat-theme", next); } catch (e) { /* not essential */ }
  const btn = document.getElementById("theme-btn");
  if (btn) { btn.textContent = t("theme")[next]; btn.title = t("theme_title"); }
  // the chart, the family grid and the trust map read the resolved colours out of
  // the computed style, so they have to be repainted rather than just restyled
  if (redraw && S.meta) { drawChart(); renderFamilies(); renderTrust(); renderTable(); renderDetail(); }
}
// the head script already set the attribute; this syncs THEME and the button label
applyTheme(readTheme(), false);
const tierColor = i => getComputedStyle(document.body).getPropertyValue(TIERVAR[i]).trim();

/* ---------------------------------------------------------------------- load */
async function load() {
  // no-cache, not no-store: the page and its data are deployed together, and a
  // visitor holding a stale copy of one and a fresh copy of the other would see
  // columns silently go missing. This revalidates, so an unchanged file still
  // comes back as a 304 and none of the 2.9 MB is re-downloaded.
  const get = u => fetch(u, { cache: "no-cache" });
  const [meta, csv] = await Promise.all([
    get("data/meta.json").then(r => r.json()),
    get("data/screening.csv").then(r => r.text()),
  ]);
  S.meta = meta;
  const lines = csv.trim().split("\n");
  const H = lines[0].split(",");
  const ix = Object.fromEntries(H.map((h, i) => [h, i]));
  // undefined, not just empty: an older data file may not carry every column
  const num = v => (v === "" || v === undefined ? null : +v);
  S.rows = new Array(lines.length - 1);
  for (let k = 1; k < lines.length; k++) {
    const c = lines[k].split(",");
    S.rows[k - 1] = {
      i: c[ix.i], s: +c[ix.s], f: c[ix.f], e: c[ix.e].split(" "), n: +c[ix.n],
      d: num(c[ix.d]), g: +c[ix.g], u: +c[ix.u], l: num(c[ix.l]), m: num(c[ix.m]),
      t: num(c[ix.t]), p: num(c[ix.p]), w: +c[ix.w], r: +c[ix.r], b: +c[ix.b],
      fm: +c[ix.fm], fa: c[ix.fa], fb: c[ix.fb],
      // second property: value, spread, latent distance, its own tier, its own
      // training role, and the DFT reference where one exists
      k: num(c[ix.k]), ku: num(c[ix.ku]), kl: num(c[ix.kl]),
      kw: num(c[ix.kw]), kr: num(c[ix.kr]) ?? 0, kd: num(c[ix.kd]),
      // quasiparticle gap, exciton binding energy, absorption onset
      q: num(c[ix.q]), x: num(c[ix.x]), o: num(c[ix.o]),
    };
  }
  for (const r of S.rows) setEdges(r);
  document.getElementById("loading").hidden = true;
  buildUI();
  apply();
}

/* --------------------------------------------------------- gap corrections */
// Stored as polynomial coefficients, highest power first: the optical correction is
// a quadratic, because over 184 materials a straight line is biased high through the
// middle of the range. Older data files carry a/b instead.
function applyCorrection(c, g) {
  const co = c.coeffs || [c.a, c.b];
  return co.reduce((acc, k) => acc * g + k, 0);
}

/* --------------------------------------------------------------- band edges */
// Not shipped in the data: the edges are a subtraction between the two models,
// so the page does it here and can state the condition in one place. They exist
// only when NEITHER model has disowned its half — a gap the tool just called
// out-of-domain must not reappear as two band positions, and neither must a work
// function from a chemistry the second model has never seen. Note IP = χ + gap,
// so the gap filter already constrains the ionisation potential indirectly.
// Computed once per row after the data loads, so the table can also sort on it.
function setEdges(r) {
  const off = r.k === null || r.kw === null || r.w === 2 || r.kw === 2
              || r.g < S.meta.metal_gap_eV;
  r.ea = off ? null : r.k - r.g / 2;
  r.ip = off ? null : r.k + r.g / 2;
}

/* ------------------------------------------------------------------ filtering */
function passPopulation(row) {
  if (S.f.pop === 0) return row.b === 1 && row.r !== 1;   // calibrated & unseen
  if (S.f.pop === 1) return row.b === 1;                  // all stable
  return true;                                            // everything
}
function apply() {
  const f = S.f;
  const q = f.q.trim().toLowerCase();
  const edgeFilterOn = [f.eamin, f.eamax, f.ipmin, f.ipmax].some(v => v !== null);
  const out = [], outFam = [];
  let hidden = 0, eligible = 0;   // eligible: passes everything except the edge range
  for (const row of S.rows) {
    const inPopulation = passPopulation(row) && !(f.notrain && row.r === 1);
    if (!inPopulation && S.fam.scope === 1) continue;
    if (!f.tiers[row.w]) { if (inPopulation) hidden++; continue; }
    if (f.gmin !== null && row.g < f.gmin) continue;
    if (f.gmax !== null && row.g > f.gmax) continue;
    if (f.type >= 0 && row.t !== f.type) continue;
    if (q && !row.f.toLowerCase().includes(q)) continue;
    if (f.has.length && !f.has.every(el => row.e.includes(el))) continue;
    if (f.not.length && f.not.some(el => row.e.includes(el))) continue;
    if (inPopulation && row.ea !== null) eligible++;
    if (edgeFilterOn) {
      // a row with no band edges cannot satisfy a band-edge range, and dropping it
      // is better than quietly letting it through
      if (row.ea === null) continue;
      if (f.eamin !== null && row.ea < f.eamin) continue;
      if (f.eamax !== null && row.ea > f.eamax) continue;
      if (f.ipmin !== null && row.ip < f.ipmin) continue;
      if (f.ipmax !== null && row.ip > f.ipmax) continue;
    }
    if (row.fm >= 0) outFam.push(row);   // chemistry and gap filters, any population
    if (inPopulation) out.push(row);
  }
  const { key, dir } = S.sort;
  out.sort((a, b) => {
    let x = a[key], y = b[key];
    if (key === "f") return dir * String(x).localeCompare(String(y));
    if (x === null) x = Infinity; if (y === null) y = Infinity;
    return dir * (x - y);
  });
  S.viewFam = outFam;
  S.hiddenByTier = hidden;
  S.edgeEligible = eligible;
  S.edgeFilterOn = edgeFilterOn;
  S.view = out;
  S.hover = null;
  if (S.sel && !out.includes(S.sel)) S.sel = null;
  renderCount(); renderWarning(); drawChart(); renderTable(); renderDetail();
  if (S.fam.sel && !outFam.includes(S.fam.sel)) S.fam.sel = null;
  renderFamilies(); renderTrust();
}

/* --------------------------------------------------------------------- render */
function renderCount() {
  const el = document.getElementById("count");
  const base = S.view.length ? t("count", int(S.view.length), int(S.meta.n_rows))
             : (S.edgeFilterOn ? t("count_none_edges") : t("count_none"));
  const extra = S.hiddenByTier ? t("count_hidden", int(S.hiddenByTier)) : "";
  // with a band-edge range set, the honest denominator is not the whole selection
  // but the part of it that has edges at all
  const edges = S.edgeFilterOn ? t("count_edges", int(S.edgeEligible)) : "";
  el.innerHTML = base + `<span style="color:var(--text-3)">${extra}${edges}</span>`;
}
function renderWarning() {
  const box = document.getElementById("pop-warning");
  const parts = [];
  if (S.f.pop === 2) parts.push(t("warn_all"));
  if (S.f.pop >= 1 && !S.f.notrain) parts.push(t("warn_train"));
  box.innerHTML = parts.map(p => `<div class="banner">${p}</div>`).join("");
}

/* chart ------------------------------------------------------------------- */
const cv = () => document.getElementById("chart");
let PLOT = null;
function drawChart() {
  const c = cv(), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  // apply() redraws whatever tab is open, so this runs with the canvas hidden and
  // measuring zero. Drawing then produces a viewport with negative width that the
  // hover and zoom maths would happily use.
  if (w < 60 || h < 60) { PLOT = null; return; }
  c.width = w * dpr; c.height = h * dpr;
  const x = c.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, w, h);
  const cs = getComputedStyle(document.body);
  const grid = cs.getPropertyValue("--border").trim();
  const text3 = cs.getPropertyValue("--text-3").trim();
  const M = { l: 58, r: 10, t: 8, b: 32 };
  const iw = w - M.l - M.r, ih = h - M.t - M.b;
  if (!S.view.length) { PLOT = null; return; }

  let ULO, UHI;
  let gmax = 0, gmin = 0;
  for (const r of S.view) { if (r.g > gmax) gmax = r.g; if (r.g < gmin) gmin = r.g; }
  gmax = Math.max(1, Math.ceil(gmax * 2) / 2);
  gmin = Math.min(0, Math.floor(gmin));
  const calY = S.meta.calibration;
  let ulo = Infinity, uhi = 0;
  for (const r of S.view) { if (r.u < ulo) ulo = r.u; if (r.u > uhi) uhi = r.u; }
  // keep both verdict thresholds on screen whatever the filter selects, so the
  // vertical position of a point means the same thing in every view
  ULO = Math.min(ulo * 0.7, calY.unc_median * 0.35, 0.02);
  UHI = Math.max(uhi * 1.4, calY.unc_q75 * 2.2);
  // what "fit to data" means, kept separate from the current viewport: zooming out
  // past it would spread the axes over empty space and squeeze every point into a
  // few pixels, which reads as the data vanishing
  const FULL = { gmin, gmax, lylo: Math.log10(ULO), lyhi: Math.log10(UHI) };
  // A zoom window belongs to the data it was drawn on. Change the filters and the
  // data can move out from under it, leaving an empty frame that reads as broken.
  // Re-clamp it to the new extent, and drop it when the two no longer overlap.
  if (S.zoom) {
    const z = S.zoom;
    if (z.gmax <= FULL.gmin || z.gmin >= FULL.gmax ||
        z.lyhi <= FULL.lylo || z.lylo >= FULL.lyhi) {
      S.zoom = null;
    } else {
      const [a, b] = clampSpan(z.gmin, z.gmax, FULL.gmin, FULL.gmax, 0.05);
      const [c2, d2] = clampSpan(z.lylo, z.lyhi, FULL.lylo, FULL.lyhi, 0.15);
      S.zoom = (b - a >= FULL.gmax - FULL.gmin - 1e-9 &&
                d2 - c2 >= FULL.lyhi - FULL.lylo - 1e-9)
               ? null : { gmin: a, gmax: b, lylo: c2, lyhi: d2 };
    }
    document.getElementById("chart-reset").hidden = !S.zoom;
  }
  if (S.zoom) {
    gmin = S.zoom.gmin; gmax = S.zoom.gmax;
    ULO = Math.pow(10, S.zoom.lylo); UHI = Math.pow(10, S.zoom.lyhi);
  }
  const px = g => M.l + Math.max(0, Math.min(1, (g - gmin) / (gmax - gmin))) * iw;
  const py = u => {
    const v = Math.log10(Math.max(ULO, Math.min(UHI, u)));
    const lo = Math.log10(ULO), hi = Math.log10(UHI);
    return M.t + ih - ((v - lo) / (hi - lo)) * ih;
  };
  const invx = mx => gmin + ((mx - M.l) / iw) * (gmax - gmin);
  const invy = my => {
    const lo = Math.log10(ULO), hi = Math.log10(UHI);
    return lo + ((M.t + ih - my) / ih) * (hi - lo);   // возвращает log10(u)
  };
  // px/py clamp, so a point outside the window would be painted on the border and
  // read as a dense stripe that is not there. Zoomed views have to drop them.
  const inView = r => r.g >= gmin && r.g <= gmax && r.u >= ULO && r.u <= UHI;
  PLOT = { px, py, invx, invy, M, iw, ih, gmin, gmax, ULO, UHI, full: FULL, inView };

  // grid + axes
  x.strokeStyle = grid; x.fillStyle = text3; x.lineWidth = 1;
  x.font = "11px ui-sans-serif, system-ui, sans-serif";
  x.textAlign = "right"; x.textBaseline = "middle";
  // log ticks generated rather than listed: a fixed list leaves one label on screen
  // once the viewport is zoomed into a fraction of a decade
  const decades = Math.log10(UHI) - Math.log10(ULO);
  const mant = decades > 2.5 ? [1] : decades > 1.2 ? [1, 3] : [1, 2, 3, 5, 7];
  const ticks = [];
  for (let k = Math.floor(Math.log10(ULO)); k <= Math.ceil(Math.log10(UHI)); k++)
    for (const mm of mant) {
      const u = mm * Math.pow(10, k);
      if (u >= ULO && u <= UHI) ticks.push(u);
    }
  const tlbl = u => u >= 1 ? String(+u.toFixed(1))
                  : u.toFixed(Math.min(4, Math.max(1, Math.ceil(-Math.log10(u)) + 1))).replace(/0+$/, "");
  for (const u of ticks) {
    const yy = Math.round(py(u)) + .5;
    x.beginPath(); x.moveTo(M.l, yy); x.lineTo(M.l + iw, yy); x.stroke();
    x.fillText(tlbl(u), M.l - 7, yy);
  }
  x.textAlign = "center"; x.textBaseline = "top";
  const span = gmax - gmin;
  const step = span > 6 ? 2 : span > 2.5 ? 1 : span > 1 ? 0.5 : span > 0.4 ? 0.2 : 0.1;
  const lbl = v => (step < 1 ? v.toFixed(1) : String(Math.round(v)));
  for (let g = Math.ceil(gmin / step) * step; g <= gmax + 1e-9; g += step) {
    const xx = Math.round(px(g)) + .5;
    x.beginPath(); x.moveTo(xx, M.t); x.lineTo(xx, M.t + ih); x.stroke();
    x.fillText(lbl(g), xx, M.t + ih + 7);
  }
  x.fillText(t("ax_gap"), M.l + iw / 2, M.t + ih + 20);
  x.save(); x.translate(12, M.t + ih / 2); x.rotate(-Math.PI / 2);
  x.textBaseline = "top"; x.fillText(t("ax_unc"), 0, 0); x.restore();

  // points, drawn worst-first so reliable sits on top
  const cols = [tierColor(0), tierColor(1), tierColor(2)];
  const alpha = S.view.length > 6000 ? .35 : (S.view.length > 1500 ? .55 : .8);
  for (const tier of [2, 1, 0]) {
    x.fillStyle = cols[tier]; x.globalAlpha = alpha;
    x.beginPath();
    for (const r of S.view) {
      if (r.w !== tier || !inView(r)) continue;
      const cx = px(r.g), cy = py(r.u);
      x.moveTo(cx + 2.1, cy); x.arc(cx, cy, 2.1, 0, 6.2832);
    }
    x.fill();
  }
  x.globalAlpha = 1;

  // verdict thresholds
  const cal = S.meta.calibration;
  x.setLineDash([4, 4]); x.strokeStyle = text3;
  for (const u of [cal.unc_median, cal.unc_q75]) {
    const yy = Math.round(py(u)) + .5;
    x.beginPath(); x.moveTo(M.l, yy); x.lineTo(M.l + iw, yy); x.stroke();
  }
  x.setLineDash([]);

  // the point under the cursor, so the tooltip is visibly about one specific dot
  if (S.hover && S.view.includes(S.hover) && inView(S.hover)) {
    x.strokeStyle = cs.getPropertyValue("--text-2").trim(); x.lineWidth = 1.5;
    x.beginPath(); x.arc(px(S.hover.g), py(S.hover.u), 4.5, 0, 6.2832); x.stroke();
  }
  // selection
  if (S.sel && S.view.includes(S.sel) && inView(S.sel)) {
    x.strokeStyle = cs.getPropertyValue("--text-1").trim(); x.lineWidth = 2;
    x.beginPath(); x.arc(px(S.sel.g), py(S.sel.u), 5.5, 0, 6.2832); x.stroke();
  }
}
function nearest(mx, my) {
  if (!PLOT) return { row: null, crowd: 0 };
  let best = null, bd = 144, crowd = 0;
  for (const r of S.view) {
    if (!PLOT.inView(r)) continue;
    const dx = PLOT.px(r.g) - mx, dy = PLOT.py(r.u) - my;
    const d = dx * dx + dy * dy;
    if (d < 36) crowd++;                       // within ~6 px of the cursor
    if (d < bd) { bd = d; best = r; }
  }
  return { row: best, crowd };
}

function renderDetail(hostId = "detail", row = undefined) {

  const wfcal = S.meta.wf_calibration || {};
  const ood = r.w === 2;
  const iv = cal.scale90 * r.u;
  // shipped per row: these come from linear heads on the ensemble's latent space,
  // which a static page cannot evaluate. The polynomial is the fallback for a data
  // file built before the heads existed.
  const H = S.meta.optical_heads;
  const qp = r.q !== null && r.q !== undefined ? r.q : applyCorrection(C.quasiparticle, r.g);
  const exp = r.o !== null && r.o !== undefined ? r.o : applyCorrection(C.optical, r.g);
  const eb = r.x === undefined ? null : r.x;
  const tierErr = cal.tier_mae ? Object.values(cal.tier_mae)[r.w] : null;
  const rows = [];
  if (!ood) rows.push([t("d_interval"), "± " + fmt(iv, 2) + " eV"]);
  if (!ood && r.g >= S.meta.metal_gap_eV) {

    rows.push([t("d_ea"), fmt(r.ea, 2) + " eV"]);
    rows.push([t("d_ip"), fmt(r.ip, 2) + " eV"]);
  }
  if (r.t !== null) rows.push([t("d_type"), t("d_type_val",
      r.t ? t("type_indirect") : t("type_direct"), fmt(r.p, 2),
      fmt(S.meta.calibration.type_threshold ?? 0.33, 2))]);
  if (r.m !== null) rows.push([t("d_metal"), fmt(r.m, 2)]);
  rows.push([t("d_spread"), fmt(r.u, 3) + " eV"]);
  if (r.l !== null) rows.push([t("d_latent"),

  rows.push([t("d_verdict"), `<span class="v" style="justify-content:flex-end">
     <i class="tierdot" style="background:var(${TIERVAR[r.w]})"></i>${t("tier")[r.w]}</span>`]);
  if (tierErr) rows.push([t("d_tiererr"), fmt(tierErr, 2) + " eV"]);
  if (r.d !== null) {
    rows.push([t("d_dft"), fmt(r.d, 2) + " eV"]);
    rows.push([t("d_err"), fmt(Math.abs(r.g - r.d), 2) + " eV"]);
  }
  // the second property keeps its own block: its own spread, its own verdict, and
  // its own training role, because it was trained on a different set entirely
  if (r.k !== null) {
    rows.push([t("d_wf"), fmt(r.k, 2) + " eV"]);
    if (wfcal.scale90 && r.kw !== 2)
      rows.push([t("d_wf_iv"), "± " + fmt(wfcal.scale90 * r.ku, 2) + " eV"]);
    rows.push([t("d_wf_spread"), fmt(r.ku, 3) + " eV"]);
    if (r.kw !== null) rows.push([t("d_wf_verdict"), `<span class="v" style="justify-content:flex-end">
       <i class="tierdot" style="background:var(${TIERVAR[r.kw]})"></i>${t("tier")[r.kw]}</span>`]);
    if (r.kd !== null) {
      rows.push([t("d_wf_dft"), fmt(r.kd, 2) + " eV"]);
      rows.push([t("d_wf_err"), fmt(Math.abs(r.k - r.kd), 2) + " eV"]);
      rows.push([t("d_wf_role"), t("role")[r.kr]]);
    }
  }
  rows.push([t("d_atoms"), String(r.n)]);
  rows.push([t("d_source"), S.meta.sources[r.s]]);
  rows.push([t("d_role"), t("role")[r.r]]);

  el.innerHTML = `<h3>${r.f}</h3>

    <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    ${ood ? `<div class="note stop">${t("d_stop")}</div>` : ""}
    ${(!ood && r.g >= S.meta.metal_gap_eV) ? `<div class="note">
        <b>${t("d_qp")}</b> — ${H ? t("d_qp_note", H.n, fmt(H.mae_cv.gap_gw, 2))
                                     : t("d_qp_note", C.quasiparticle.n, "0.19")}<br>
        ${eb !== null && H ? `<b>${t("d_eb")}</b> — ${t("d_eb_note", fmt(H.mae_cv.exciton_binding, 2))}<br>` : ""}
        <b>${t("d_opt")}</b> — ${H ? t("d_opt_note", H.n, fmt(H.mae_cv.optical, 2))

    ${(!ood && r.g < S.meta.metal_gap_eV) ? `<div class="note">${t("d_metallike", fmt(S.meta.metal_gap_eV, 1))}</div>` : ""}

        ${t("d_edges_caveat")}</div>` : ""}
    ${(r.k !== null && r.ea === null && r.kw === 2) ? `<div class="note stop">${t("d_wf_stop")}</div>` : ""}
    ${(r.k !== null && r.ea === null && r.kw !== 2 && ood) ? `<div class="note">${t("d_wf_gapstop")}</div>` : ""}
    <div class="note">${t("d_note", fmt(cal.test_mae, 2))}</div>`;

/* families ---------------------------------------------------------------- */
function famRows() {
  // Two passes over the same prototype. `best` is the filtered set, so one filter bar
  // still governs all three tabs. `all` ignores the filters and exists only to draw
  // the grid: the honest default leaves 6 of 97 pairs for 1H-MX2 and none at all for
  // the honeycombs, and a grid built from the survivors alone collapsed to three
  // cells and read as a broken page. The family's shape is a fact about the data, not
  // about the current filter, so it is always drawn; what the filter excludes is
  // greyed out rather than deleted.
  const best = new Map();                       // "A|B" -> row with the smallest spread
  const count = new Map();
  const all = new Map();
  const source = S.fam.scope === 1 ? S.view : S.viewFam;
  for (const r of S.rows) {
    if (r.fm !== S.fam.pick) continue;
    const k = r.fa + "|" + r.fb;
    const cur = all.get(k);
    if (!cur || r.u < cur.u) all.set(k, r);
  }
  for (const r of source) {
    if (r.fm !== S.fam.pick) continue;
    const k = r.fa + "|" + r.fb;
    count.set(k, (count.get(k) || 0) + 1);
    const cur = best.get(k);
    if (!cur || r.u < cur.u) best.set(k, r);
  }
  return { best, count, all };
}
function renderFamilies() {
  const { best, count, all } = famRows();
  const host = document.getElementById("famgrid");
  const meta = S.meta.families[S.fam.pick];
  const thin = best.size < meta.pairs && S.fam.scope === 1;
  document.getElementById("fam-count").innerHTML =
    t("fam_count", best.size, meta.pairs) +
    (thin ? ` <button class="preset" id="fam-widen" style="margin-left:8px">${t("widen")}</button>` : "");
  if (!all.size) {
    host.innerHTML = `<div class="empty">${t("fam_empty")}</div>`;
    renderDetail("fam-detail", null);
    return;
  }
  const order = e => {
    const p = S.meta.ptable[e];
    return p ? p[0] * 100 + p[1] : 9999;        // порядок таблицы Менделеева
  };
  // axes from every pair the prototype has, not from the survivors of the filter
  const As = [...new Set([...all.values()].map(r => r.fa))].sort((x, y) => order(x) - order(y));
  const Bs = [...new Set([...all.values()].map(r => r.fb))].sort((x, y) => order(x) - order(y));
  // the colour ramp spans the whole family too, so it does not collapse when the
  // filter leaves one cell
  const gaps = [...all.values()].map(r => r.g);
  const lo = Math.min(...gaps), hi = Math.max(...gaps);
  const cs = getComputedStyle(document.body);
  const c0 = cs.getPropertyValue("--ramp-lo").trim(), c1 = cs.getPropertyValue("--ramp-hi").trim();
  const dark = cs.getPropertyValue("--surface-1").trim() === "#1a1a19";

  let html = `<table><tr><th class="rowh" style="font-weight:400;color:var(--text-3)">` +
             `${t("fam_axis_a")} ↓<br>${t("fam_axis_b")} →</th>` +
             Bs.map(b => `<th>${b}</th>`).join("") + "</tr>";
  for (const a of As) {
    html += `<tr><th class="rowh">${a}</th>`;
    for (const b of Bs) {
      const key = a + "|" + b;
      const r = best.get(key) || all.get(key);
      if (!r) { html += `<td><div class="famcell none"></div></td>`; continue; }
      const passes = best.has(key);
      const u = hi > lo ? (r.g - lo) / (hi - lo) : .5;
      const bg = passes ? mix(c0, c1, u) : "";
      const fg = passes ? ((dark ? u < .45 : u > .5) ? "#ffffff" : "#0b0b0b") : "";
      const n = count.get(key);
      const cls = "famcell" + (passes ? "" : " muted") + (r.w !== 0 ? " unsure" : "") +
                  (r.r === 1 ? " trained" : "") + (S.fam.sel === r ? " sel" : "");
      const tip = `${r.f} — ${fmt(r.g, 2)} eV, ${t("tier")[r.w]}` +
                  (r.r === 1 ? " · " + t("badge_train") : "") +
                  (n > 1 ? " · " + t("fam_multi", n) : "") +
                  (passes ? "" : " · " + t("fam_filtered"));
      const style = passes ? `background:${bg};color:${fg}` : "";
      html += `<td><div class="${cls}" style="${style}"
        data-fa="${a}" data-fb="${b}" title="${tip}">
        <b>${fmt(r.g, 2)}</b><small>${r.f}</small></div></td>`;
    }
    html += "</tr>";
  }
  document.getElementById("t-fam-lo").textContent = `${t("fam_lo")} ${fmt(lo, 2)}`;
  document.getElementById("t-fam-hi").textContent = `${fmt(hi, 2)} eV ${t("fam_hi")}`;
  host.innerHTML = html + "</table>";
  renderDetail("fam-detail", S.fam.sel);
}

/* trust map --------------------------------------------------------------- */
function mix(a, b, u) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [r1, g1, b1] = p(a), [r2, g2, b2] = p(b);
  const q = v => Math.round(v).toString(16).padStart(2, "0");
  return "#" + q(r1 + (r2 - r1) * u) + q(g1 + (g2 - g1) * u) + q(b1 + (b2 - b1) * u);
}
function trustFromView() {
  // Recomputed from whatever is on screen, so the map answers "for the selection I
  // am looking at". Restricted to Alexandria rows the ensemble never trained on:
  // mixing sources would mix DFT functionals into one error, and training rows
  // would report memory rather than skill.
  const per = new Map();
  let used = 0;
  for (const r of S.view) {
    if (r.s !== 0 || r.r === 1 || r.d === null) continue;
    used++;
    const err = Math.abs(r.g - r.d);
    for (const el of r.e) {
      const a = per.get(el) || [0, 0];
      per.set(el, [a[0] + err, a[1] + 1]);
    }
  }
  const MIN_N = S.meta.trust_map_basis.min_n || 20;
  const SPARSE = S.meta.trust_map_basis.sparse_below || 60;
  const tm = {};
  for (const [el, [sum, n]] of per) {
    if (n >= MIN_N) tm[el] = { n, mae: sum / n, sparse: n < SPARSE ? 1 : 0 };
  }
  return { tm, used };
}
function renderTrust() {
  const { ptable: pt } = S.meta;
  const { tm, used } = trustFromView();
  const host = document.getElementById("ptable");
  if (Object.keys(tm).length < 3) {
    host.innerHTML = `<div class="empty">${t("tm_thin", int(used), S.meta.trust_map_basis.min_n || 20)}
      <br><br><button class="preset" id="tm-widen">${t("widen")}</button></div>`;
    document.getElementById("t-tm-lede").textContent = t("tm_lede", int(used));
    document.getElementById("tm-prose").innerHTML = t("tm_prose");
    return;
  }
  const basis = { n_structures: used };
  const vals = Object.values(tm).map(v => v.mae);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const cs = getComputedStyle(document.body);
  const c0 = cs.getPropertyValue("--ramp-lo").trim(), c1 = cs.getPropertyValue("--ramp-hi").trim();
  const dark = cs.getPropertyValue("--surface-1").trim() === "#1a1a19";
  const cells = [];
  for (let row = 1; row <= 9; row++) {
    for (let col = 1; col <= 18; col++) {
      const sym = Object.keys(pt).find(s => pt[s][0] === row && pt[s][1] === col);
      if (!sym) { cells.push(`<div class="cell void"></div>`); continue; }
      const d = tm[sym];
      if (!d) { cells.push(`<div class="cell nodata" title="${sym}: ${t("tm_nodata")}"><b>${sym}</b></div>`); continue; }
      const u = hi > lo ? (d.mae - lo) / (hi - lo) : .5;
      const bg = mix(c0, c1, u);
      const fg = (dark ? u < .45 : u > .5) ? "#ffffff" : "#0b0b0b";
      const sp = d.sparse ? ";border-style:dashed;border-color:currentColor" : "";
      cells.push(`<div class="cell" style="background:${bg};color:${fg}${sp}"
        title="${sym} — MAE ${fmt(d.mae, 2)} eV over ${d.n} structures${d.sparse ? " (thinly measured)" : ""}">
        <b>${sym}</b><small>${fmt(d.mae, 2)}</small></div>`);
    }
  }
  host.innerHTML = cells.join("");
  document.getElementById("t-tm-lede").textContent = t("tm_lede", int(basis.n_structures));
  document.getElementById("t-tm-lo").textContent = `${t("tm_lo")} ${fmt(lo, 2)}`;
  document.getElementById("t-tm-hi").textContent = `${fmt(hi, 2)} eV ${t("tm_hi")}`;
  document.getElementById("t-tm-nodata").textContent = t("tm_nodata");
  document.getElementById("t-tm-sparse").textContent = t("tm_sparse");
  document.getElementById("tm-prose").innerHTML = t("tm_prose");
}

  document.getElementById("t-fam-greyed").textContent = t("fam_greyed");
  document.getElementById("fam-prose").innerHTML = t("fam_prose");
  document.getElementById("fam-axisnote").textContent = t("fam_axis_note");
  document.getElementById("fam-pick").innerHTML = S.meta.families.map((f, i) =>
    `<option value="${i}">${t("fam_opt", f.label, int(f.n), f.pairs)}</option>`).join("");
  renderTHead();
  document.getElementById("panel-browse").hidden = false;
}

/* -------------------------------------------------------------------- events */
document.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab) {
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b === tab));
    document.getElementById("panel-browse").hidden = tab.dataset.panel !== "browse";
    document.getElementById("panel-fam").hidden = tab.dataset.panel !== "fam";
    document.getElementById("panel-trust").hidden = tab.dataset.panel !== "trust";
    if (tab.dataset.panel === "browse") drawChart();
    return;
  }
  const chip = e.target.closest(".chip[data-tier]");
  if (chip) {
    const i = +chip.dataset.tier;
    S.f.tiers[i] = !S.f.tiers[i];
    chip.setAttribute("aria-pressed", S.f.tiers[i]);
    apply(); return;
  }
  const pre = e.target.closest(".preset[data-a]");
  if (pre) {
    S.f.gmin = pre.dataset.a === "" ? null : +pre.dataset.a;
    S.f.gmax = pre.dataset.b === "" ? null : +pre.dataset.b;
    document.getElementById("f-gmin").value = pre.dataset.a;
    document.getElementById("f-gmax").value = pre.dataset.b;
    apply(); return;
  }
  if (e.target.id === "theme-btn") {
    applyTheme(THEMES[(THEMES.indexOf(THEME) + 1) % THEMES.length], true);
    return;
  }
  if (e.target.id === "chart-reset") {
    S.zoom = null; e.target.hidden = true; drawChart(); return;
  }
  const sortBtn = e.target.closest("[data-sort]");
  if (sortBtn) {
    const k = sortBtn.dataset.sort;
    S.sort = { key: k, dir: S.sort.key === k ? -S.sort.dir : (k === "f" ? 1 : 1) };
    renderTHead(); apply(); return;
  }
  if (e.target.id === "fam-widen" || e.target.id === "tm-widen") {
    // "everything" has to mean everything, or the count will not reach the total
    // the same line just quoted and the button looks broken
    S.f.pop = 2; S.f.notrain = false; S.f.tiers = [true, true, true];
    document.getElementById("f-pop").value = "2";
    document.getElementById("f-notrain").checked = false;
    document.querySelectorAll(".chip[data-tier]").forEach(c => c.setAttribute("aria-pressed", "true"));
    apply(); return;
  }
  const cell = e.target.closest(".famcell[data-fa]");
  if (cell) {
    const { best, all } = famRows();
    const k = cell.dataset.fa + "|" + cell.dataset.fb;
    // a greyed cell is real data the filter excluded, and its card states every
    // caveat, so it opens like any other
    S.fam.sel = best.get(k) || all.get(k) || null;
    renderFamilies(); return;
  }
  const row = e.target.closest(".row[data-k]");
  if (row) { S.sel = S.view[+row.dataset.k]; renderTable(); renderDetail(); drawChart(); }
});
document.getElementById("f-reset").addEventListener("click", () => {
  S.f = BLANK_FILTERS();
  S.sel = null;
  document.getElementById("f-pop").value = "0";
  document.getElementById("f-type").value = "-1";
  for (const id of ["f-gmin", "f-gmax", "f-has", "f-not", "f-q",
                    "f-eamin", "f-eamax", "f-ipmin", "f-ipmax"])
    document.getElementById(id).value = "";
  document.getElementById("f-notrain").checked = false;
  document.querySelectorAll(".chip[data-tier]").forEach(c =>
    c.setAttribute("aria-pressed", String(S.f.tiers[+c.dataset.tier])));
  apply();
});
const syms = s => s.trim().split(/[\s,]+/).filter(Boolean)
  .map(x => x[0].toUpperCase() + x.slice(1).toLowerCase());
document.getElementById("f-pop").addEventListener("change", e => { S.f.pop = +e.target.value; apply(); });
document.getElementById("f-type").addEventListener("change", e => { S.f.type = +e.target.value; apply(); });
document.getElementById("f-notrain").addEventListener("change", e => { S.f.notrain = e.target.checked; apply(); });
for (const [id, key, cast] of [["f-gmin", "gmin", 1], ["f-gmax", "gmax", 1],
                               ["f-eamin", "eamin", 1], ["f-eamax", "eamax", 1],
                               ["f-ipmin", "ipmin", 1], ["f-ipmax", "ipmax", 1],
                               ["f-has", "has", 2], ["f-not", "not", 2], ["f-q", "q", 0]])
  document.getElementById(id).addEventListener("input", e => {
    const v = e.target.value;
    S.f[key] = cast === 1 ? (v === "" ? null : +v) : cast === 2 ? syms(v) : v;
    apply();
  });
document.getElementById("fam-pick").addEventListener("change", e => {
  S.fam.pick = +e.target.value; S.fam.sel = null; renderFamilies(); });
document.getElementById("fam-scope").addEventListener("change", e => {
  S.fam.scope = +e.target.value; S.fam.sel = null; apply(); });
document.getElementById("scroller").addEventListener("scroll", e => paintRows(e.target.scrollTop));
let DRAG = null;
function clampSpan(lo, hi, fullLo, fullHi, minSpan) {
  // keep the requested window inside the data, and no wider than it
  const full = fullHi - fullLo;
  let span = Math.min(Math.max(hi - lo, minSpan), full);
  let a = Math.min(Math.max(lo, fullLo), fullHi - span);
  return [a, a + span];
}
function setZoomFromPlot(gmin, gmax, lylo, lyhi) {
  if (!PLOT || !PLOT.full) return;
  const F = PLOT.full;
  [gmin, gmax] = clampSpan(gmin, gmax, F.gmin, F.gmax, 0.05);
  [lylo, lyhi] = clampSpan(lylo, lyhi, F.lylo, F.lyhi, 0.15);
  const fitted = gmax - gmin >= (F.gmax - F.gmin) - 1e-9 &&
                 lyhi - lylo >= (F.lyhi - F.lylo) - 1e-9;
  S.zoom = fitted ? null : { gmin, gmax, lylo, lyhi };   // zoomed all the way out is just "fit"
  document.getElementById("chart-reset").hidden = !S.zoom;
  drawChart();
}
cv().addEventListener("wheel", e => {
  if (!PLOT) return;
  e.preventDefault();
  const b = cv().getBoundingClientRect();
  const mx = e.clientX - b.left, my = e.clientY - b.top;
  const cx = PLOT.invx(mx), cy = PLOT.invy(my);          // data point under the cursor
  const k = e.deltaY > 0 ? 1.18 : 1 / 1.18;              // stays put while the rest scales
  const lo = Math.log10(PLOT.ULO), hi = Math.log10(PLOT.UHI);
  setZoomFromPlot(cx - (cx - PLOT.gmin) * k, cx + (PLOT.gmax - cx) * k,
                  cy - (cy - lo) * k, cy + (hi - cy) * k);
}, { passive: false });
cv().addEventListener("mousedown", e => {
  if (!PLOT) return;
  DRAG = { x: e.clientX, y: e.clientY, moved: false,
           gmin: PLOT.gmin, gmax: PLOT.gmax,
           lylo: Math.log10(PLOT.ULO), lyhi: Math.log10(PLOT.UHI) };
  cv().style.cursor = "grabbing";
});
addEventListener("mouseup", () => {
  if (DRAG) cv().style.cursor = "crosshair";
  DRAG = null;
});
cv().addEventListener("mousemove", e => {
  const b = cv().getBoundingClientRect();
  const mx = e.clientX - b.left, my = e.clientY - b.top;
  if (DRAG) {
    const dxp = e.clientX - DRAG.x, dyp = e.clientY - DRAG.y;
    if (Math.abs(dxp) + Math.abs(dyp) > 3) DRAG.moved = true;
    const gspan = DRAG.gmax - DRAG.gmin, lspan = DRAG.lyhi - DRAG.lylo;
    const dg = -dxp / PLOT.iw * gspan, dl = dyp / PLOT.ih * lspan;
    setZoomFromPlot(DRAG.gmin + dg, DRAG.gmax + dg, DRAG.lylo + dl, DRAG.lyhi + dl);
    document.getElementById("tip").hidden = true;
    return;
  }
  const { row: r, crowd } = nearest(mx, my);
  const tip = document.getElementById("tip");
  if (!r) { if (S.hover) { S.hover = null; drawChart(); } tip.hidden = true; return; }
  if (S.hover !== r) { S.hover = r; drawChart(); }
  const cal = S.meta.calibration;
  tip.innerHTML = `<b>${r.f}</b>${fmt(r.g, 2)} eV${r.w === 2 ? "" : " ± " + fmt(cal.scale90 * r.u, 2)}
    <span style="color:var(${TIERVAR[r.w]})"> · ${t("tier")[r.w]}</span>` +
    (crowd > 1 ? `<span style="color:var(--text-3)"><br>${t("crowd", crowd - 1)}</span>` : "");
  tip.hidden = false;
  const tx = Math.min(mx + 12, b.width - tip.offsetWidth - 6);
  tip.style.left = Math.max(4, tx) + "px";
  tip.style.top = Math.max(4, my - tip.offsetHeight - 10) + "px";
});
cv().addEventListener("mouseleave", () => {
  document.getElementById("tip").hidden = true;
  if (S.hover) { S.hover = null; drawChart(); }
});
cv().addEventListener("click", e => {
  if (DRAG && DRAG.moved) return;                        // a pan is not a selection
  const b = cv().getBoundingClientRect();
  const { row: r } = nearest(e.clientX - b.left, e.clientY - b.top);
  if (r) { S.sel = r; renderTable(); renderDetail(); drawChart(); }
});
cv().addEventListener("dblclick", () => {
  S.zoom = null; document.getElementById("chart-reset").hidden = true; drawChart();
});
addEventListener("resize", () => { drawChart(); renderTable(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (THEME === "system" && S.meta) { drawChart(); renderTrust(); renderFamilies(); }
});

load().catch(err => {
  document.getElementById("loading").textContent = "Could not load the data: " + err.message;
});
</script>
</body>
