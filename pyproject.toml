[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanomat-ai"
version = "1.1.0"
description = "Band gap of 2D semiconductors from crystal structure: CGCNN ensemble with uncertainty"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "torch_geometric>=2.5",
  "pymatgen>=2024.1",
  "numpy>=1.26",
  "pandas>=2.0",
]

[project.optional-dependencies]
app = ["gradio>=5.0"]
train = ["scikit-learn>=1.4"]
baseline = ["scikit-learn>=1.4", "xgboost>=2.0", "matminer>=0.9", "jarvis-tools>=2024.1", "matplotlib>=3.8"]
dev = ["pytest>=8"]
# the MCP server (nanomat/mcp_server.py): mcp 1.x and 2.x both work
llm = ["mcp>=1.2"]

[project.scripts]
nanomat-screen = "screen_bandgap:main"

[tool.setuptools]
packages = ["nanomat"]
py-modules = ["screen_bandgap", "validate_experiment", "train_cgcnn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
