name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric pymatgen pandas numpy pytest
      - name: Smoke tests (inference on shipped weights)
        run: pytest -q
      - name: External validation runs offline
        run: python validate_experiment.py
      # the in-browser predictor (docs/js/nanomat.js) must say what Python says, on the
      # reference structures as POSCAR and as symmetrised CIF
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser predictor matches Python
        run: |
          python scripts/export_web_model.py --out /tmp/web_model
          python scripts/web_parity.py --examples-only --out /tmp/parity.json
          node scripts/web_parity.mjs --model /tmp/web_model --cases /tmp/parity.json
